[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobtrack"
version = "0.1.0"
description = "Personal job application tracker with CV-to-listing match scoring"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Your Name", email = "you@example.com" },
]
license = { text = "MIT" }
keywords = ["jobs", "tracker", "cli", "tf-idf"]

dependencies = [
    "pydantic>=2.5",
    "scikit-learn>=1.3",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
jobtrack = "jobtrack.cli:main"

[tool.setuptools.packages.find]
include = ["jobtrack*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
